name: Export validated T2 offline source

on:
  push:
    branches:
      - t2/export-offline-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated scientific source
        uses: actions/checkout@v4
        with:
          ref: df15dd601bfb3e1dbce836b44125db2c993354e7
          fetch-depth: 1

      - name: Verify exact validated SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "df15dd601bfb3e1dbce836b44125db2c993354e7"
          test -z "$(git status --porcelain)"

      - name: Build exact source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --prefix=GovTrust-FL-df15dd601bfb3e1dbce836b44125db2c993354e7/ \
            --output=GovTrust-FL-df15dd601bfb3e1dbce836b44125db2c993354e7.tar.gz \
            HEAD
          sha256sum GovTrust-FL-df15dd601bfb3e1dbce836b44125db2c993354e7.tar.gz | tee SOURCE_ARCHIVE_SHA256.txt
          printf '%s\n' \
            'EXECUTION_SHA=df15dd601bfb3e1dbce836b44125db2c993354e7' \
            'SOURCE_TREE_SHA=f3fdfc23bdc76d30aec4ab34aa7374db64bc35c8' \
            'SCIENTIFIC_TRAINING_STARTED=NO' \
            > SOURCE_EXPORT_MANIFEST.txt

      - name: Upload exact validated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: GovTrust-FL-df15dd6-offline-source
          path: |
            GovTrust-FL-df15dd601bfb3e1dbce836b44125db2c993354e7.tar.gz
            SOURCE_ARCHIVE_SHA256.txt
            SOURCE_EXPORT_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
